$kind: http-request
url: "{{baseUrl}}/api/events/{{eventId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"title":"Updated Event","description":"Updated description","date":"1 Jan 2027","time":"11:00","location":"Pune","category":"Hands-on"}'
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
