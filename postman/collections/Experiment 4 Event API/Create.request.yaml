$kind: http-request
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"title":"Postman Event","description":"Created by API","date":"1 Jan 2027","time":"10:00","location":"Mumbai","category":"Showcase"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('eventId', pm.response.json().data.id);
    language: text/javascript
order: 4000
